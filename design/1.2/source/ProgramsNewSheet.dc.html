<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Programs — new program</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.base}}; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 30px; color: {{c.t1}}">PROGRAMS</span>
    <div style="height: 140px; border-radius: 12px; background: {{c.surface}}; border: 1px solid {{c.border}}"></div>
    <div style="height: 200px; border-radius: 12px; background: {{c.surface}}; border: 1px solid {{c.border}}"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

  <div role="dialog" aria-label="New program" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{c.surface}}; border: 1px solid {{c.border}}; border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: {{c.bstrong}}"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 20px; color: {{c.t1}}">New program</span>
      <a href="Programs.dc.html" aria-label="Close" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.raised}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="pname" style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">PROGRAM NAME</label>
      <input id="pname" value="{{name}}" placeholder="e.g. Hypertrophy Block" readonly="readonly" style="height: 52px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; padding: 0 14px; font-family: 'Archivo', sans-serif; font-size: 16px; color: {{c.t1}}">
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div role="radiogroup" aria-label="{{g.label}}" style="display: flex; flex-direction: column; gap: 6px">
        <span style="display: flex; justify-content: space-between; align-items: baseline; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">{{g.label}}<span style="font-size: 9px; letter-spacing: 0.15em; color: {{g.reqFg}}">{{g.req}}</span></span>
        <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="2">
          <button role="radio" aria-checked="{{o.checked}}" style="min-height: 60px; box-sizing: border-box; padding: 9px 12px; border-radius: 10px; border: 1px solid {{o.bd}}; background: {{o.bg}}; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span style="flex: 0 0 auto; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2px solid {{o.dot}}; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{o.dot}}"></span></sc-if>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; color: {{c.t1}}">{{o.name}}</span>
              <span style="font-family: 'Archivo', sans-serif; font-size: 12px; line-height: 1.4; color: {{c.t2}}">{{o.desc}}</span>
            </span>
          </button>
        </sc-for>
      </div>
    </sc-for>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="{{createHref}}" aria-disabled="{{disabledAria}}" style="height: 52px; box-sizing: border-box; border-radius: 10px; background: {{btnBg}}; border: 1px solid {{btnBd}}; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.03em; color: {{btnFg}}">{{label}}</a>
      <span style="text-align: center; font-size: 12px; line-height: 1.5; color: {{c.tm}}">{{hint}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"state":{"editor":"enum","options":["empty","ready","pending"],"default":"empty"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', success: '#166534', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', success: '#4ade80', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    const st = this.props.state === 'ready' || this.props.state === 'pending' ? this.props.state : 'empty';
    const chosen = st !== 'empty';
    const opt = (name, desc, on) => ({ name, desc, on, checked: on ? 'true' : 'false', bd: on ? c.accent : c.border, bg: on ? c.accentMuted : c.surface, dot: on ? c.accentText : c.bstrong });
    const groups = [
      { label: 'SCHEDULE', opts: [
        opt('Weekdays', 'Each workout has its days, like Push on Monday.', chosen),
        opt('Sequence', 'Workouts in a set order. Do the next one whenever you train.', false)
      ] },
      { label: 'PLANNING', opts: [
        opt('Stable', 'The same sets every week. A change in one week lasts that week only.', chosen),
        opt('Week-dependent', 'Each week starts as a copy of the last, and you change it as you go.', false)
      ] }
    ].map((g) => Object.assign(g, { req: chosen ? '' : 'CHOOSE ONE', reqFg: c.accentText }));
    return {
      c, groups, name: 'Upper / Lower',
      label: st === 'pending' ? 'CREATING…' : 'CREATE PROGRAM',
      disabledAria: chosen ? (st === 'pending' ? 'true' : 'false') : 'true',
      createHref: st === 'ready' ? 'PlannerPriorities.dc.html' : '#',
      btnBg: chosen ? c.accent : c.raised, btnBd: chosen ? c.accent : c.border, btnFg: chosen ? c.onAccent : c.td,
      hint: chosen ? 'You can change both later in the program.' : 'Choose a schedule and a planning type to create it.'
    };
  }
}
</script>
</body>
</html>
