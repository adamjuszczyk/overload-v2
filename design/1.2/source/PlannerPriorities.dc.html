<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Program planner — 1 priorities</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1430px; box-sizing: border-box; background: {{c.base}}; display: flex; flex-direction: column; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div style="padding: 16px 16px 14px; border-bottom: 1px solid {{c.bsub}}; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Programs.dc.html" aria-label="Back to programs" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
      <button aria-label="Rename program" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 8px; text-align: left; color: {{c.t1}}">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Bulk</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.tm}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
      </button>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <a href="{{s.href}}" role="tab" aria-selected="{{s.sel}}" style="text-decoration: none; display: flex; align-items: center; justify-content: center; background: {{s.bg}}; color: {{s.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.15em">{{s.label}}</a>
      </sc-for>
    </div>
  </div>

  <div style="padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">OPTIONAL — SKIP IF YOU DON'T NEED IT</span>
    <div style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 0 12px 0 4px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="12">
        <div style="padding: 10px 0; border-bottom: 1px solid {{g.line}}; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: center; gap: 4px">
            <button aria-expanded="{{g.exp}}" aria-label="{{g.toggleLabel}}" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.tm}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="{{g.chev}}"></polyline></svg></button>
            <span style="flex: 1; min-width: 0; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: {{c.t1}}">{{g.name}}</span>
            <div role="group" aria-label="{{g.segLabel}}" style="flex: 0 0 auto; display: grid; grid-template-columns: auto auto; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
                <button aria-pressed="{{g.fOn}}" style="height: 42px; padding: 0 12px; border: 1px solid {{g.fBd}}; border-radius: 7px; background: {{g.fBg}}; color: {{g.fFg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em">FOCUS</button>
                <button aria-pressed="{{g.dOn}}" style="height: 42px; padding: 0 12px; border: 1px solid {{g.dBd}}; border-radius: 7px; background: {{g.dBg}}; color: {{g.dFg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em">DON'T CARE</button>
              </div>
          </div>
          <sc-if value="{{g.hasSum}}" hint-placeholder-val="{{false}}">
            <span style="margin: -2px 0 2px 48px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em; color: {{c.t2}}">{{g.sum}}</span>
          </sc-if>
          <sc-if value="{{g.exp}}" hint-placeholder-val="{{false}}">
            <div style="margin: 4px 0 2px 21px; padding-left: 26px; border-left: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{g.subs}}" as="s" hint-placeholder-count="3">
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px">
                  <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
                    <span style="font-size: 14px; font-weight: 500; color: {{c.t2}}">{{s.name}}</span>
                    <sc-if value="{{s.inh}}" hint-placeholder-val="{{false}}">
                      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em; color: {{c.tm}}">INHERITED: {{s.inhLabel}}</span>
                    </sc-if>
                  </div>
                  <div role="group" aria-label="{{s.segLabel}}" style="flex: 0 0 auto; display: grid; grid-template-columns: auto auto; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
                <button aria-pressed="{{s.fOn}}" style="height: 42px; padding: 0 12px; border: 1px solid {{s.fBd}}; border-radius: 7px; background: {{s.fBg}}; color: {{s.fFg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em">FOCUS</button>
                <button aria-pressed="{{s.dOn}}" style="height: 42px; padding: 0 12px; border: 1px solid {{s.dBd}}; border-radius: 7px; background: {{s.dBg}}; color: {{s.dFg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em">DON'T CARE</button>
              </div>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; padding: 12px 16px; border-top: 1px solid {{c.bsub}}; background: {{c.base}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <a href="Programs.dc.html" style="text-decoration: none; height: 52px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; color: {{c.t1}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em">SAVE</a>
    <button style="height: 52px; border-radius: 10px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.03em">START</button>
  </div>
  <nav style="height: 64px; border-top: 1px solid {{c.bsub}}; background: {{c.surface}}; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: center">
    <sc-for list="{{nav}}" as="t" hint-placeholder-count="6">
      <a href="#" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: {{t.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; letter-spacing: 0.1em">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"$preview":{"width":390,"height":1430}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', errorMuted: 'rgba(185,28,28,0.10)', success: '#166534', successMuted: 'rgba(22,101,52,0.10)', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', errorMuted: 'rgba(248,113,113,0.15)', success: '#4ade80', successMuted: 'rgba(74,222,128,0.12)', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    const ICONS = { TODAY: 'M6.5 6.5l11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7', PLAN: 'M3 4h7v7H3zM3 14h7v7H3zM14 4h7M14 9h7M14 15h7M14 20h7', PROGRESS: 'M22 7l-8.5 8.5-5-5L2 17M16 7h6v6', HISTORY: 'M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20zM12 6v6l4 2', LIBRARY: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z', SETTINGS: 'M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1' };
    const nav = Object.keys(ICONS).map((k) => ({ label: k, d: ICONS[k], current: 'false', fg: c.tm }));
    const steps = [['1 · PRIORITIES', 'PlannerPriorities.dc.html'], ['2 · EXERCISES', 'PlannerExercises.dc.html'], ['3 · VOLUME', 'PlannerVolume.dc.html']].map(([label, href], i) => ({ label, href, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? c.accent : 'transparent', fg: i === 0 ? c.onAccent : c.t2 }));
    const chip = (x) => x ? { bd: c.accent, bg: c.accentMuted, fg: c.accentText, on: 'true' } : { bd: 'transparent', bg: 'transparent', fg: c.t2, on: 'false' };
    const nice = (x) => x.charAt(0) + x.slice(1).toLowerCase();
    const LABEL = { focus: 'FOCUS', dont_care: "DON'T CARE" };
    const TREE = {
      CHEST: ['UPPER CHEST', 'MID CHEST', 'LOWER CHEST'], BACK: ['LATS', 'MID BACK', 'LOWER BACK', 'TRAPS'], SHOULDERS: ['FRONT DELT', 'SIDE DELT', 'REAR DELT'], BICEPS: ['BICEPS', 'BRACHIALIS'], TRICEPS: ['TRICEPS LONG HEAD', 'TRICEPS LATERAL HEAD'], FOREARMS: ['FOREARMS'], QUADS: ['QUADS'], HAMSTRINGS: ['HAMSTRINGS'], GLUTES: ['GLUTES'], CALVES: ['CALVES'], CORE: ['ABS', 'OBLIQUES'], OTHER: ['ADDUCTORS']
    };
    const groupMarks = { CHEST: 'focus', BACK: 'focus', FOREARMS: 'dont_care', CALVES: 'dont_care' };
    const subMarks = { 'LOWER CHEST': 'dont_care', 'SIDE DELT': 'focus' };
    const expanded = ['CHEST', 'SHOULDERS'];
    const groups = Object.keys(TREE).map((name) => {
      const gm = groupMarks[name] || null;
      const F = chip(gm === 'focus'), Dn = chip(gm === 'dont_care');
      const exceptions = TREE[name].filter((s) => subMarks[s] && subMarks[s] !== gm).map((s) => s);
      const hasSum = !!gm && exceptions.length > 0;
      const exp = expanded.includes(name);
      const subs = TREE[name].map((s) => {
        const own = subMarks[s] || null;
        const eff = own || gm;
        const SF = chip(own === 'focus'), SD = chip(own === 'dont_care');
        return { name: nice(s), segLabel: 'Priority for ' + nice(s), inh: own === null && eff !== null, inhLabel: eff ? LABEL[eff] : '', fOn: SF.on, fBd: SF.bd, fBg: SF.bg, fFg: SF.fg, dOn: SD.on, dBd: SD.bd, dBg: SD.bg, dFg: SD.fg };
      });
      return { name, segLabel: 'Priority for ' + name, hasSum, sum: hasSum ? (name + ' WITHOUT ' + exceptions.join(', ')) : '', exp, toggleLabel: (exp ? 'Collapse ' : 'Expand ') + name, chev: exp ? '18 15 12 9 6 15' : '6 9 12 15 18 9', fOn: F.on, fBd: F.bd, fBg: F.bg, fFg: F.fg, dOn: Dn.on, dBd: Dn.bd, dBg: Dn.bg, dFg: Dn.fg, subs, line: c.bsub };
    });
    groups[groups.length - 1].line = 'transparent';
    return { c, nav, steps, groups };
  }
}
</script>
</body>
</html>
