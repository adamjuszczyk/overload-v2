<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set-kind picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.base}}; font-family: 'Archivo', sans-serif; color: {{c.t1}}">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 30px; color: {{c.t1}}">{{bgTitle}}</span>
    <div style="height: 52px; border-radius: 10px; background: {{c.surface}}; border: 1px solid {{c.border}}"></div>
    <div style="height: 300px; border-radius: 12px; background: {{c.surface}}; border: 1px solid {{c.border}}"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

  <div role="dialog" aria-label="What is this set?" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{c.surface}}; border: 1px solid {{c.border}}; border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: {{c.bstrong}}"></div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">{{eyebrow}}</span>
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 20px; color: {{c.t1}}">What is this set?</span>
      </div>
      <a href="{{closeHref}}" aria-label="Close" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.raised}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; border-radius: 10px; border: 1px solid {{k.bd}}; background: {{k.bg}}">
          <button aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="min-height: 52px; padding: 8px 12px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span style="flex: 0 0 auto; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2px solid {{k.dot}}; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{k.on}}" hint-placeholder-val="{{false}}"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{k.dot}}"></span></sc-if>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; color: {{c.t1}}">{{k.name}}</span>
              <span style="font-family: 'Archivo', sans-serif; font-size: 12px; line-height: 1.4; color: {{c.t2}}">{{k.desc}}</span>
            </span>
          </button>
          <sc-if value="{{k.showStages}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 12px 12px 42px">
              <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.t2}}">{{k.stageLabel}}</span>
              <div style="height: 44px; box-sizing: border-box; display: flex; align-items: center; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}">
                <button aria-label="Fewer" style="width: 40px; height: 42px; border: 0; background: transparent; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: {{c.t2}}; padding: 0">−</button>
                <span style="width: 24px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: {{c.t1}}">{{k.stages}}</span>
                <button aria-label="More" style="width: 40px; height: 42px; border: 0; background: transparent; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: {{c.t2}}; padding: 0">+</button>
              </div>
            </div>
            <sc-if value="{{showStageRest}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 12px 12px 42px">
              <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.t2}}">REST BETWEEN</span>
              <div style="height: 44px; box-sizing: border-box; display: flex; align-items: center; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}">
                <button aria-label="Rest between: less" style="width: 40px; height: 42px; border: 0; background: transparent; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: {{c.t2}}; padding: 0">−</button>
                <span style="min-width: 72px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; color: {{c.t1}}">{{k.stageRest}}</span>
                <button aria-label="Rest between: more" style="width: 40px; height: 42px; border: 0; background: transparent; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: {{c.t2}}; padding: 0">+</button>
              </div>
            </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{showRest}}" hint-placeholder-val="{{true}}">
    <div style="min-height: 56px; box-sizing: border-box; padding: 6px 12px; border-radius: 10px; border: 1px solid {{c.border}}; display: flex; justify-content: space-between; align-items: center; gap: 10px">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; color: {{c.t1}}">Rest after this set</span>
        <span style="font-family: 'Archivo', sans-serif; font-size: 12px; color: {{c.t2}}">{{restNote}}</span>
      </span>
      <div style="height: 44px; box-sizing: border-box; display: flex; align-items: center; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}">
                <button aria-label="Rest after this set: less" style="width: 40px; height: 42px; border: 0; background: transparent; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: {{c.t2}}; padding: 0">−</button>
                <span style="min-width: 72px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; color: {{c.t1}}">DEFAULT</span>
                <button aria-label="Rest after this set: more" style="width: 40px; height: 42px; border: 0; background: transparent; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: {{c.t2}}; padding: 0">+</button>
              </div>
    </div>
    </sc-if>
    <sc-if value="{{isPlan}}" hint-placeholder-val="{{true}}">
    <a href="TagSheet.dc.html" style="min-height: 52px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; text-decoration: none; display: flex; align-items: center; gap: 12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.t2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"></path><circle cx="7" cy="7" r="1.5"></circle></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; color: {{c.t1}}">Cues</span>
        <span style="font-family: 'Archivo', sans-serif; font-size: 12px; color: {{c.t2}}">Push here</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.tm}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </a>

    </sc-if>
    <sc-if value="{{canRemove}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; border-top: 1px solid {{c.bsub}}">
      <button style="height: 48px; border: 0; background: transparent; display: flex; align-items: center; padding: 0 2px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em; color: {{c.error}}">REMOVE THIS SET</button>
    </div>
    </sc-if>
    <sc-if value="{{isWorkout}}" hint-placeholder-val="{{false}}">
      <span style="font-size: 13px; line-height: 1.5; color: {{c.t2}}">Changes this workout only. Next week's plan stays as it is; the change shows up in REVIEW when you plan it.</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"context":{"editor":"enum","options":["plan","workout","program"],"default":"plan"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'dropset' }; }
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', success: '#166534', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', success: '#4ade80', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    const list = [
      { id: 'normal', name: 'Normal', desc: 'A straight working set.' },
      { id: 'warmup', name: 'Warmup', desc: 'Lighter, not counted as volume. Usually the first sets.' },
      { id: 'dropset', name: 'Dropset', desc: 'Straight into a lighter weight, no rest.', stageLabel: 'DROPS' },
      { id: 'restpause', name: 'Rest-pause', desc: 'Same weight, a few breaths, more reps.', stageLabel: 'PAUSES' },
      { id: 'myo', name: 'Myo-reps', desc: 'An activation set, then short mini-sets.', stageLabel: 'MINI-SETS' },
      { id: 'cluster', name: 'Cluster', desc: 'The reps split by short rests inside the set.', stageLabel: 'CLUSTERS' }
    ];
    const kinds = list.map((k) => {
      const on = this.state.picked === k.id;
      return {
        name: k.name, desc: k.desc, on, pressed: on ? 'true' : 'false',
        bd: on ? c.accent : c.border, bg: on ? c.accentMuted : c.surface, dot: on ? c.accentText : c.bstrong,
        showStages: on && !!k.stageLabel, stageLabel: k.stageLabel || '', stages: k.id === 'myo' ? '3' : '1', stageRest: k.id === 'dropset' ? 'NO TIMER' : '0:15',
        pick: () => this.setState({ picked: k.id })
      };
    });
    const ctx = ['workout', 'program'].includes(this.props.context) ? this.props.context : 'plan';
    const W = ctx === 'workout', PR = ctx === 'program';
    return { c, kinds, isPlan: ctx === 'plan', canRemove: ctx !== 'workout', showRest: ctx === 'plan', showStageRest: ctx !== 'workout', restNote: 'Every week from now on.', isWorkout: W, bgTitle: W ? 'PULL 1' : PR ? 'BULK' : 'PLAN',
      eyebrow: W ? 'LAT PULLDOWN · SET 03 · THIS WORKOUT' : PR ? 'INCLINE DUMBBELL PRESS · SET 04' : 'LAT PULLDOWN · SET 03 · WEEK 2',
      closeHref: W ? 'Workout.dc.html' : PR ? 'PlannerVolume.dc.html' : 'Main.dc.html' };
  }
}
</script>
</body>
</html>
