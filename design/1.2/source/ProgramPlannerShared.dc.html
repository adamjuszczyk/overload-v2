<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Program planner — one workout, several weekdays</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.base}}; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}"></div>
      <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px; color: {{c.t1}}">Cut PPL</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
      <span style="background: {{c.accent}}"></span><span></span><span></span>
    </div>
    <div style="height: 300px; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

  <div role="dialog" aria-labelledby="t-g14" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; background: {{c.surface}}; border: 1px solid {{c.border}}; border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: {{c.bstrong}}"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">CUT PPL</span>
        <span id="t-g14" style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 20px; line-height: 1.2; color: {{c.t1}}">One workout, several weekdays</span>
      </div>
      <button aria-label="Dismiss" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.raised}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    </div>
    <span style="font-size: 14px; line-height: 1.5; color: {{c.t2}}">This program plans the same workout on more than one weekday, so a change to it affects every one of those days.</span>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 15px; color: {{c.t1}}">{{g.name}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.tm}}">{{g.days}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
      <a href="ProgramPlannerConfirmsSplit.dc.html" style="text-decoration: none; height: 52px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.accent}}; background: {{c.accentMuted}}; color: {{c.accentText}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.15em">GIVE EACH DAY ITS OWN WORKOUT</a>
      <button style="height: 52px; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; color: {{c.t1}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em">KEEP AS IS</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', errorMuted: 'rgba(185,28,28,0.10)', success: '#166534', successMuted: 'rgba(22,101,52,0.10)', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', errorMuted: 'rgba(248,113,113,0.15)', success: '#4ade80', successMuted: 'rgba(74,222,128,0.12)', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    const groups = [
      { name: 'Push', days: 'MONDAY · THURSDAY' },
      { name: 'Pull', days: 'TUESDAY · FRIDAY' }
    ];
    return { c, groups };
  }
}
</script>
</body>
</html>
