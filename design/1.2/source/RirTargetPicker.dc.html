<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RIR target picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.base}}; font-family: 'Archivo', sans-serif; color: {{c.t1}}">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 30px; color: {{c.t1}}">PLAN</span>
    <div style="height: 56px; border-radius: 10px; background: {{c.surface}}; border: 1px solid {{c.border}}"></div>
    <div style="height: 220px; border-radius: 12px; background: {{c.surface}}; border: 1px solid {{c.border}}"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

  <div role="dialog" aria-label="RIR target" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{c.surface}}; border: 1px solid {{c.border}}; border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: {{c.bstrong}}"></div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">SEATED CABLE ROW · SET 01 · WEEK 2</span>
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 20px; color: {{c.t1}}">RIR target</span>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.raised}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid {{c.border}}; border-radius: 10px; overflow: hidden; background: {{c.surface}}">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="height: 46px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.15em; cursor: pointer">{{m.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isNumber}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">REPS IN RESERVE</span>
        <div style="display: flex; align-items: center; gap: 12px">
          <button aria-label="Less RIR" style="width: 52px; height: 52px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; font-family: 'JetBrains Mono', monospace; font-size: 22px; color: {{c.t2}}">−</button>
          <span style="width: 110px; height: 72px; box-sizing: border-box; border-radius: 12px; border: 2px solid {{c.accent}}; background: {{c.surface}}; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 34px; color: {{c.t1}}">8</span>
          <button aria-label="More RIR" style="width: 52px; height: 52px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; font-family: 'JetBrains Mono', monospace; font-size: 22px; color: {{c.t2}}">+</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isRange}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 6px 0">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">FROM</span>
          <span style="width: 100%; height: 72px; box-sizing: border-box; border-radius: 12px; border: 2px solid {{c.accent}}; background: {{c.surface}}; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 34px; color: {{c.t1}}">1</span>
          <div style="display: flex; gap: 8px">
            <button aria-label="From: fewer" style="width: 52px; height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: {{c.t2}}">−</button>
            <button aria-label="From: more" style="width: 52px; height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: {{c.t2}}">+</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">TO</span>
          <span style="width: 100%; height: 72px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 34px; color: {{c.t1}}">2</span>
          <div style="display: flex; gap: 8px">
            <button aria-label="To: fewer" style="width: 52px; height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: {{c.t2}}">−</button>
            <button aria-label="To: more" style="width: 52px; height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.raised}}; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: {{c.t2}}">+</button>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isRange}}" hint-placeholder-val="{{true}}">
      <span style="margin-top: -6px; text-align: center; font-size: 13px; line-height: 1.45; color: {{c.t2}}">Either number is on plan. Pick on the day.</span>
    </sc-if>

    <sc-if value="{{isNone}}" hint-placeholder-val="{{false}}">
      <div style="border-radius: 12px; background: {{c.raised}}; padding: 18px 16px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px; color: {{c.t1}}">No RIR target</span>
      </div>
    </sc-if>

    <button role="checkbox" aria-checked="{{allPressed}}" onClick="{{toggleAll}}" style="min-height: 52px; padding: 0 12px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
      <span style="flex: 0 0 auto; width: 20px; height: 20px; box-sizing: border-box; border-radius: 5px; border: 2px solid {{boxBd}}; background: {{boxBg}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{all}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></sc-if>
      </span>
      <span style="font-family: 'Archivo', sans-serif; font-size: 14px; color: {{c.t1}}">Use for all 3 sets of Seated Cable Row</span>
    </button>

    <button style="height: 52px; border-radius: 10px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.03em">{{summary}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'range', all: true }; }
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', success: '#166534', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', success: '#4ade80', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    const mode = this.state.mode;
    const modes = [['none', 'NONE'], ['number', 'NUMBER'], ['range', 'RANGE']].map(([id, label]) => ({
      label, pressed: mode === id ? 'true' : 'false',
      bg: mode === id ? c.accent : c.surface, fg: mode === id ? c.onAccent : c.t2,
      pick: () => this.setState({ mode: id })
    }));
    const summary = mode === 'none' ? 'CLEAR TARGET' : mode === 'number' ? 'SET RIR 2' : 'SET RIR 1–2';
    return {
      c, modes, summary,
      isNone: mode === 'none', isNumber: mode === 'number', isRange: mode === 'range',
      all: this.state.all, allPressed: this.state.all ? 'true' : 'false',
      boxBd: this.state.all ? c.accent : c.bstrong, boxBg: this.state.all ? c.accent : c.surface,
      toggleAll: () => this.setState({ all: !this.state.all })
    };
  }
}
</script>
</body>
</html>
