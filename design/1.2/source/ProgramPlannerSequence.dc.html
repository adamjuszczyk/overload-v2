<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Program planner — sequence schedule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1230px; box-sizing: border-box; background: {{c.base}}; display: flex; flex-direction: column; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div style="padding: 16px 16px 14px; border-bottom: 1px solid {{c.bsub}}; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Programs.dc.html" aria-label="Back to programs" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
      <button aria-label="Rename program" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 8px; text-align: left; color: {{c.t1}}">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Bulk</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.tm}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
      </button>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <a href="{{s.href}}" role="tab" aria-selected="{{s.sel}}" style="text-decoration: none; display: flex; align-items: center; justify-content: center; background: {{s.bg}}; color: {{s.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.15em">{{s.label}}</a>
      </sc-for>
    </div>
  </div>

  <div style="padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div role="group" aria-label="Schedule type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 44px; margin-bottom: 8px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
      <a href="PlannerExercises.dc.html" aria-pressed="false" style="text-decoration: none; display: flex; align-items: center; justify-content: center; background: transparent; color: {{c.t2}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">WEEKDAY</a>
      <button aria-pressed="true" style="border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">SEQUENCE</button>
    </div>

    <section aria-label="Sequence" style="margin-bottom: 8px; background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 8px 6px 16px 16px; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 6px; border-bottom: 1px solid {{s.line}}">
          <span style="flex: 0 0 auto; width: 22px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; color: {{c.tm}}">{{s.n}}</span>
          <sc-if value="{{s.rest}}" hint-placeholder-val="{{false}}">
            <a href="ProgramPlannerSheets.dc.html" aria-label="{{s.changeLabel}}" style="flex: 1; min-width: 0; height: 44px; text-decoration: none; display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.15em; color: {{c.tm}}">REST DAY</a>
          </sc-if>
          <sc-if value="{{s.work}}" hint-placeholder-val="{{true}}">
            <a href="ProgramPlannerSheets.dc.html" aria-label="{{s.changeLabel}}" style="flex: 1; min-width: 0; height: 44px; text-decoration: none; display: flex; align-items: center; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 15px; color: {{c.t1}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.label}}</a>
          </sc-if>
          <button aria-label="Move slot up" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{s.upFg}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg></button>
          <button aria-label="Move slot down" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{s.downFg}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
          <a href="ProgramPlannerConfirms.dc.html" aria-label="Remove slot" style="flex: 0 0 auto; width: 44px; height: 44px; color: {{c.tm}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg></a>
        </div>
      </sc-for>
      <a href="ProgramPlannerSheets.dc.html" style="margin: 8px 10px 0 0; text-decoration: none; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px dashed {{c.bstrong}}; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">+ ADD SLOT</a>
    </section>

    <sc-for list="{{closed}}" as="o" hint-placeholder-count="5">
      <div style="height: 64px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 16px">
        <span style="flex: 1; min-width: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 16px; color: {{c.t1}}">{{o.name}}</span>
        <button aria-expanded="false" aria-label="{{o.label}}" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.tm}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      </div>
    </sc-for>
    <a href="ProgramPlannerSheets.dc.html" style="text-decoration: none; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px dashed {{c.bstrong}}; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">+ ADD WORKOUT</a>
  </div>

  <div style="margin-top: auto; padding: 12px 16px; border-top: 1px solid {{c.bsub}}; background: {{c.base}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <a href="Programs.dc.html" style="text-decoration: none; height: 52px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; color: {{c.t1}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em">SAVE</a>
    <button style="height: 52px; border-radius: 10px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.03em">START</button>
  </div>
  <nav style="height: 64px; border-top: 1px solid {{c.bsub}}; background: {{c.surface}}; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: center">
    <sc-for list="{{nav}}" as="t" hint-placeholder-count="6">
      <a href="#" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: {{t.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; letter-spacing: 0.1em">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"$preview":{"width":390,"height":1230}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', errorMuted: 'rgba(185,28,28,0.10)', success: '#166534', successMuted: 'rgba(22,101,52,0.10)', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', errorMuted: 'rgba(248,113,113,0.15)', success: '#4ade80', successMuted: 'rgba(74,222,128,0.12)', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    const ICONS = { TODAY: 'M6.5 6.5l11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7', PLAN: 'M3 4h7v7H3zM3 14h7v7H3zM14 4h7M14 9h7M14 15h7M14 20h7', PROGRESS: 'M22 7l-8.5 8.5-5-5L2 17M16 7h6v6', HISTORY: 'M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20zM12 6v6l4 2', LIBRARY: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z', SETTINGS: 'M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1' };
    const nav = Object.keys(ICONS).map((k) => ({ label: k, d: ICONS[k], current: 'false', fg: c.tm }));
    const steps = [['1 · PRIORITIES', 'PlannerPriorities.dc.html'], ['2 · EXERCISES', 'PlannerExercises.dc.html'], ['3 · VOLUME', 'PlannerVolume.dc.html']].map(([label, href], i) => ({ label, href, sel: i === 1 ? 'true' : 'false', bg: i === 1 ? c.accent : 'transparent', fg: i === 1 ? c.onAccent : c.t2 }));
    const order = ['Push 1', 'Pull 1', 'Legs', null, 'Push 2', 'Pull 2', null];
    const slots = order.map((w, i) => {
      const rest = w === null;
      return {
        n: String(i + 1).padStart(2, '0'), label: rest ? 'REST DAY' : w, changeLabel: 'Change slot ' + (i + 1), rest, work: !rest,
        upFg: i === 0 ? c.td : c.t2, downFg: i === order.length - 1 ? c.td : c.t2, line: i === order.length - 1 ? 'transparent' : c.bsub
      };
    });
    const closed = ['Push 1', 'Pull 1', 'Push 2', 'Pull 2', 'Legs'].map((name) => ({ name, label: 'Show editor for ' + name }));
    return { c, nav, steps, slots, closed };
  }
}
</script>
</body>
</html>
