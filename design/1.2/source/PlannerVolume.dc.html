<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Program planner — 3 volume</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1495px; box-sizing: border-box; background: {{c.base}}; display: flex; flex-direction: column; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div style="padding: 16px 16px 14px; border-bottom: 1px solid {{c.bsub}}; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Programs.dc.html" aria-label="Back to programs" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
      <button aria-label="Rename program" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 8px; text-align: left; color: {{c.t1}}">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Bulk</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.tm}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
      </button>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <a href="{{s.href}}" role="tab" aria-selected="{{s.sel}}" style="text-decoration: none; display: flex; align-items: center; justify-content: center; background: {{s.bg}}; color: {{s.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.15em">{{s.label}}</a>
      </sc-for>
    </div>
  </div>

  <div style="padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">PLANNING</span>
      <div role="group" aria-label="Planning" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
        <a href="ProgramPlannerVolumeCustom.dc.html" aria-pressed="false" style="text-decoration: none; display: flex; align-items: center; justify-content: center; background: transparent; color: {{c.t2}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">STABLE</a>
        <button aria-pressed="true" style="border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.15em">WEEK-DEPENDENT</button>
      </div>
      <span style="font-size: 13px; line-height: 1.45; color: {{c.t2}}">Only week 1 is planned here; later weeks copy forward.</span>
    </div>


    <div style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 8px 16px 8px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 44px">
        <span style="flex: 1; min-width: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 18px; color: {{c.t1}}">Push 1</span>
        <span style="flex: 0 0 auto; width: 132px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">SETS</span>
      </div>

      <div style="margin: 4px -16px 0; padding: 0 16px 16px; border-top: 1px solid {{c.bsub}}; background: {{c.raised}}; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 4px; min-height: 64px; margin-left: -12px">
          <button aria-expanded="true" aria-label="Hide set targets for Incline Dumbbell Press" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.tm}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg></button>
          <span style="flex: 1; min-width: 0; font-weight: 600; font-size: 15px; line-height: 1.25; color: {{c.t1}}">Incline Dumbbell Press</span>
          <div role="group" aria-label="Sets for Incline Dumbbell Press" style="flex: 0 0 auto; display: grid; grid-template-columns: 44px 44px 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; align-items: center">
            <button aria-label="Fewer sets for Incline Dumbbell Press" style="height: 100%; border: 0; background: transparent; color: {{c.t2}}; font-size: 16px">−</button>
            <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; color: {{c.t1}}">4</span>
            <button aria-label="More sets for Incline Dumbbell Press" style="height: 100%; border: 0; background: transparent; color: {{c.t2}}; font-size: 16px">+</button>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 0 0 auto; width: 44px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em; color: {{c.tm}}">ALL</span>
          <a href="ProgramRepTarget.dc.html" aria-label="Set every set's rep target for Incline Dumbbell Press" style="text-decoration: none; display: flex; align-items: center; flex: 1; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; text-align: left; padding: 0 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.12em; color: {{c.tm}}">MIXED</a>
          <span style="flex: 0 0 auto; width: 150px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">REST AFTER</span>
        </div>

        <sc-for list="{{heads}}" as="h" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; gap: 8px">
              <a href="ProgramSetType.dc.html" aria-label="{{h.editLabel}}" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.tm}}; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; padding: 0">{{h.n}}</a>
              <a href="ProgramRepTarget.dc.html" aria-label="{{h.targetLabel}}" style="text-decoration: none; flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; text-align: left; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px">
                <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: {{h.tFg}}">{{h.target}}</span>
                <sc-if value="{{h.isWarm}}" hint-placeholder-val="{{false}}">
                  <span style="height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 4px; background: {{c.raised}}; border: 1px solid {{c.bsub}}; color: {{c.t2}}; display: inline-flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; letter-spacing: 0.08em">WARMUP</span>
                </sc-if>
              </a>
              <div role="group" aria-label="{{h.restLabel}}" style="flex: 0 0 auto; display: grid; grid-template-columns: 44px 62px 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{h.rBd}}; background: {{h.rBg}}; align-items: center">
                <button aria-label="Less rest" style="height: 100%; border: 0; background: transparent; color: {{h.minusFg}}; font-size: 16px">−</button>
                <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; color: {{h.rFg}}">{{h.rest}}</span>
                <button aria-label="More rest" style="height: 100%; border: 0; background: transparent; color: {{c.t2}}; font-size: 16px">+</button>
              </div>
            </div>

            <sc-if value="{{h.exp}}" hint-placeholder-val="{{false}}">
              <div style="margin: 0 0 8px 21px; padding: 4px 0 4px 21px; border-left: 2px solid {{c.accent}}; display: flex; flex-direction: column; gap: 8px">
                <a href="ProgramSetType.dc.html" aria-label="Set {{h.n}} type: dropset, 1 drop" style="align-self: flex-start; height: 32px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; border: 1px solid {{c.accent}}; background: {{c.accentMuted}}; text-decoration: none; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.accentText}}">DROPSET · 1 DROP<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></a>
                <div style="display: flex; align-items: center; gap: 8px">
                  <span style="flex: 0 0 auto; width: 16px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; color: {{c.tm}}">↳</span>
                  <a href="ProgramRepTarget.dc.html" aria-label="Rep target for the dropset stage" style="text-decoration: none; display: flex; align-items: center; flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; text-align: left; padding: 0 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: {{c.td}}">—</a>

                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <sc-for list="{{pushRest}}" as="e" hint-placeholder-count="4">
        <div style="border-top: 1px solid {{c.bsub}}; min-height: 64px; display: flex; align-items: center; gap: 4px; margin-left: -12px">
          <sc-if value="{{e.canOpen}}" hint-placeholder-val="{{true}}">
            <button aria-expanded="false" aria-label="{{e.openLabel}}" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.tm}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
          </sc-if>
          <sc-if value="{{e.noSets}}" hint-placeholder-val="{{false}}">
            <span style="flex: 0 0 auto; width: 44px"></span>
          </sc-if>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 600; font-size: 15px; line-height: 1.25; color: {{c.t1}}">{{e.name}}</span>
            <sc-if value="{{e.noSets}}" hint-placeholder-val="{{false}}">
              <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.error}}">NO SETS YET</span>
            </sc-if>
          </div>
          <div role="group" aria-label="{{e.setsLabel}}" style="flex: 0 0 auto; display: grid; grid-template-columns: 44px 44px 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; align-items: center">
            <button aria-label="Fewer sets" style="height: 100%; border: 0; background: transparent; color: {{e.minusFg}}; font-size: 16px">−</button>
            <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; color: {{e.fg}}">{{e.sets}}</span>
            <button aria-label="More sets" style="height: 100%; border: 0; background: transparent; color: {{c.t2}}; font-size: 16px">+</button>
          </div>
        </div>
      </sc-for>
    </div>

    <sc-for list="{{closed}}" as="o" hint-placeholder-count="4">
      <div style="height: 64px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 16px">
        <span style="flex: 1; min-width: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 16px; color: {{c.t1}}">{{o.name}}</span>
        <span style="flex: 0 0 auto; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.15em; color: {{c.tm}}">{{o.day}}</span>
        <button aria-expanded="false" aria-label="{{o.label}}" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.tm}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 12px 16px; border-top: 1px solid {{c.bsub}}; background: {{c.base}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <a href="Programs.dc.html" style="text-decoration: none; height: 52px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; color: {{c.t1}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em">SAVE</a>
    <button style="height: 52px; border-radius: 10px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.03em">START</button>
  </div>
  <nav style="height: 64px; border-top: 1px solid {{c.bsub}}; background: {{c.surface}}; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: center">
    <sc-for list="{{nav}}" as="t" hint-placeholder-count="6">
      <a href="#" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: {{t.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; letter-spacing: 0.1em">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"$preview":{"width":390,"height":1495}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', errorMuted: 'rgba(185,28,28,0.10)', success: '#149534', successMuted: 'rgba(22,101,52,0.10)', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', errorMuted: 'rgba(248,113,113,0.15)', success: '#4ade80', successMuted: 'rgba(74,222,128,0.12)', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    const ICONS = { TODAY: 'M6.5 6.5l11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7', PLAN: 'M3 4h7v7H3zM3 14h7v7H3zM14 4h7M14 9h7M14 15h7M14 20h7', PROGRESS: 'M22 7l-8.5 8.5-5-5L2 17M16 7h6v6', HISTORY: 'M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20zM12 6v6l4 2', LIBRARY: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z', SETTINGS: 'M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1' };
    const nav = Object.keys(ICONS).map((k) => ({ label: k, d: ICONS[k], current: 'false', fg: c.tm }));
    const steps = [['1 · PRIORITIES', 'PlannerPriorities.dc.html'], ['2 · EXERCISES', 'PlannerExercises.dc.html'], ['3 · VOLUME', 'PlannerVolume.dc.html']].map(([label, href], i) => ({ label, href, sel: i === 2 ? 'true' : 'false', bg: i === 2 ? c.accent : 'transparent', fg: i === 2 ? c.onAccent : c.t2 }));
    const sel = (x) => x ? { bd: c.accent, bg: c.accentMuted, fg: c.accentText, on: 'true' } : { bd: c.border, bg: c.surface, fg: c.t2, on: 'false' };
    const head = (n, target, rest, opts) => {
      const o = opts || {};
      const changed = rest !== null;
      const exp = !!o.stages;
      return {
        n, target: target || '—', tFg: target ? c.t1 : c.td, targetLabel: 'Rep target for set ' + n, restLabel: 'Rest after set ' + n, editLabel: 'Set ' + n + ': type',
        rest: changed ? rest : 'CHAIN', rBd: changed ? c.accent : c.border, rBg: changed ? c.accentMuted : c.surface, rFg: changed ? c.accentText : c.tm, minusFg: changed ? c.t2 : c.td,
        exp, hasStages: !!o.stages, isWarm: !!o.warmup,
        nBd: exp ? c.accent : c.border, nBg: exp ? c.accentMuted : c.surface, nFg: exp ? c.accentText : c.tm
      };
    };
    const heads = [
      head('01', '12', null, { warmup: true }),
      head('02', '8–12', null),
      head('03', '8–12', null),
      head('04', '8–12', '3min 0s', { stages: true })
    ];
    const stageKinds = ['DROPSET', 'REST-PAUSE', 'MYO-REPS', 'CLUSTER'].map((k, i) => { const X = sel(i === 0); return { label: k, on: X.on, bd: X.bd, bg: X.bg, fg: X.fg }; });
    const row = (name, sets) => ({ name, sets, noSets: sets === 0, canOpen: sets > 0, openLabel: 'Show set targets for ' + name, setsLabel: 'Sets for ' + name, minusFg: sets === 0 ? c.td : c.t2, fg: sets === 0 ? c.td : c.t1 });
    const pushRest = [row('Dips', 0), row('Pec Deck Fly', 3), row('Lateral Raise', 4), row('Triceps Pushdown', 3)];
    const closed = [['Pull 1', 'TUE'], ['Push 2', 'THU'], ['Pull 2', 'FRI'], ['Legs', 'SAT']].map(([name, day]) => ({ name, day, label: 'Show editor for ' + name }));
    return { c, nav, steps, heads, stageKinds, pushRest, closed };
  }
}
</script>
</body>
</html>
