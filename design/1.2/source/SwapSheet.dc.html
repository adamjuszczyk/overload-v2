<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout — swap for today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.base}}; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

  <div role="dialog" aria-label="Swap for today" style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; box-sizing: border-box; background: {{c.surface}}; border: 1px solid {{c.border}}; border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: {{c.bstrong}}"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">LAT PULLDOWN · TODAY ONLY</span>
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 20px; color: {{c.t1}}">Swap for what?</span>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.raised}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    </div>

    <div style="display: flex; gap: 6px; overflow: hidden">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <button aria-pressed="{{g.pressed}}" style="flex: 0 0 auto; height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid {{g.bd}}; background: {{g.bg}}; color: {{g.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em">{{g.label}}</button>
      </sc-for>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; border-top: 1px solid {{c.bsub}}">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="6">
        <button aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="min-height: 52px; border: 0; border-bottom: 1px solid {{c.bsub}}; background: {{o.bg}}; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; text-align: left; cursor: pointer">
          <span style="font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 15px; color: {{c.t1}}">{{o.name}}</span>
          <span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2px solid {{o.dot}}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{o.dot}}"></span></sc-if>
          </span>
        </button>
      </sc-for>
      <button style="margin-top: 10px; height: 44px; border-radius: 10px; border: 1px dashed {{c.bstrong}}; background: transparent; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.t2}}">+ NEW BACK EXERCISE</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; line-height: 1.45; color: {{c.t2}}">The set left moves to {{picked}}. Next week's plan stays the same.</span>
      <button style="height: 52px; border-radius: 10px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.03em">SWAP FOR TODAY</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'Machine Pulldown' }; }
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', success: '#166534', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', success: '#4ade80', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    const groups = ['BACK', 'ALL', 'REAR DELTS', 'BICEPS'].map((g, i) => ({ label: g, pressed: i === 0 ? 'true' : 'false', bd: i === 0 ? c.accent : c.border, bg: i === 0 ? c.accentMuted : c.surface, fg: i === 0 ? c.accentText : c.t2 }));
    const options = ['Chest-Supported Row', 'Machine Pulldown', 'Pull-Up', 'Single-Arm Cable Row', 'Straight-Arm Pulldown', 'T-Bar Row'].map((n) => {
      const on = this.state.picked === n;
      return { name: n, on, pressed: on ? 'true' : 'false', bg: on ? c.accentMuted : 'transparent', dot: on ? c.accentText : c.bstrong, pick: () => this.setState({ picked: n }) };
    });
    return { c, groups, options, picked: this.state.picked };
  }
}
</script>
</body>
</html>
