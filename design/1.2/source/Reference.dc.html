<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout — last time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.base}}; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 30px; color: {{c.t1}}">PULL 1</span>
    <div style="height: 120px; border-radius: 12px; background: {{c.surface}}; border: 1px solid {{c.border}}"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

  <div role="dialog" aria-label="Lat Pulldown, last time" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{c.surface}}; border: 1px solid {{c.border}}; border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: {{c.bstrong}}"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">FACE PULL</span>
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 20px; color: {{c.t1}}">Last time</span>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.raised}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    </div>

    <sc-for list="{{panels}}" as="p" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.2em; color: {{c.t1}}">{{p.title}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.tm}}">{{p.when}}</span>
        </div>
        <div style="background: {{c.raised}}; border-radius: 10px; padding: 4px 12px">
          <sc-for list="{{p.rows}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; padding-left: {{r.indent}}">
              <span style="width: 22px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; color: {{c.tm}}">{{r.n}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; color: {{c.t1}}">{{r.text}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{c.t2}}">{{r.rir}}</span>
              <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; letter-spacing: 0.15em; color: {{c.tm}}">{{r.badge}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <span style="font-size: 12px; line-height: 1.45; color: {{c.tm}}">Deload sessions are left out.</span>
    <a href="#" style="height: 48px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em; color: {{c.t1}}">FULL HISTORY
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', success: '#166534', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', success: '#4ade80', scrim: 'rgba(0,0,0,0.70)' }
    };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const c = Object.assign({}, P[theme]);
    const row = (n, text, rir, badge, stage) => ({ n, text, rir: rir ? '@ ' + rir : '', badge: badge || '', indent: stage ? '18px' : '0px' });
    const panels = [
      { title: 'LAST WEEK', when: 'PULL 1 · TUE 6 OCT', rows: [row('01', '15 × 18', '1'), row('02', '15 × 17', '1')] },
      { title: 'EARLIER THIS WEEK', when: 'PUSH 1 · MON 12 OCT', rows: [row('01', '15 × 20', '1'), row('02', '17.5 × 15', '1')] }
    ];
    return { c, panels };
  }
}
</script>
</body>
</html>
