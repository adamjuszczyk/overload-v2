<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Programs — delete meso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.base}}; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px; color: {{c.t1}}">CUT PPL</span>
    <div style="height: 56px; border-radius: 10px; background: {{c.surface}}; border: 1px solid {{c.border}}"></div>
    <div style="height: 240px; border-radius: 12px; background: {{c.surface}}; border: 1px solid {{c.border}}"></div>
  </div>
  <div style="position: absolute; inset: 0; background: {{c.scrim}}; display: flex; align-items: center; justify-content: center; padding: 0 20px">
    <div role="alertdialog" aria-labelledby="t" style="width: 100%; box-sizing: border-box; background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
      <span id="t" style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 18px; line-height: 1.25; color: {{c.t1}}">Delete this finished program?</span>
      <span style="font-size: 14px; line-height: 1.5; color: {{c.t2}}">Cut PPL, Jul 5 – Sep 12. Its weekly plan is deleted. Its sessions stay in History, and the saved program isn't touched. This can't be undone.</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
        <a href="MesoHistory.dc.html" style="height: 48px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; text-decoration: none; display: flex; align-items: center; justify-content: center; color: {{c.t1}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em">CANCEL</a>
        <a href="Programs.dc.html" style="height: 48px; box-sizing: border-box; border-radius: 10px; background: {{c.errorMuted}}; text-decoration: none; display: flex; align-items: center; justify-content: center; color: {{c.error}}; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.2em">DELETE</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', error: '#b91c1c', errorMuted: 'rgba(185,28,28,0.10)', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', error: '#f87171', errorMuted: 'rgba(248,113,113,0.15)', scrim: 'rgba(0,0,0,0.70)' }
    };
    const c = P[this.props.theme === 'dark' ? 'dark' : 'light'];
    return { c };
  }
}
</script>
</body>
</html>
