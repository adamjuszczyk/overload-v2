<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Program planner — save and start states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 710px; box-sizing: border-box; background: {{c.raised}}; padding: 24px 16px; display: flex; flex-direction: column; gap: 32px; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">PRIORITIES · MARK NOT SAVED</span>
    <div style="border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.base}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">OPTIONAL — SKIP IF YOU DON'T NEED IT</span>
      <span role="alert" style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: {{c.error}}"><svg style="flex: 0 0 auto; margin-top: 2px" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20zM12 8v5M12 16h.01"></path></svg><span style="display: flex; flex-direction: column; gap: 3px"><span>Couldn't update priorities.</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{c.t2}}">Failed to fetch — you may be offline</span></span></span>
      <div style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 10px 12px 10px 4px; display: flex; align-items: center; gap: 4px">
        <span style="flex: 0 0 auto; width: 44px; height: 44px; color: {{c.tm}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
        <span style="flex: 1; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: {{c.t1}}">BICEPS</span>
        <div role="group" aria-label="Priority for BICEPS" style="flex: 0 0 auto; display: grid; grid-template-columns: auto auto; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
          <button aria-pressed="false" style="height: 42px; padding: 0 12px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: {{c.t2}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em">FOCUS</button>
          <button aria-pressed="false" style="height: 42px; padding: 0 12px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: {{c.t2}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em">DON'T CARE</button>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">START · STARTING</span>
    <div style="border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.base}}; padding: 14px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 52px; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; color: {{c.t1}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em">SAVE</button>
      <button disabled aria-busy="true" style="height: 52px; border-radius: 10px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.03em">STARTING…</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">START · NO WORKOUT SCHEDULED</span>
    <div style="border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.base}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 52px; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; color: {{c.t1}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em">SAVE</button>
        <button disabled aria-describedby="why-start" style="height: 52px; border-radius: 10px; border: 0; background: {{c.raised}}; color: {{c.td}}; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.03em">START</button>
      </div>
      <span id="why-start" style="text-align: center; font-size: 13px; line-height: 1.45; color: {{c.t2}}">Schedule at least one workout to start</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">START · FAILED</span>
    <div style="border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.base}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span role="alert" style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: {{c.error}}"><svg style="flex: 0 0 auto; margin-top: 2px" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20zM12 8v5M12 16h.01"></path></svg><span style="display: flex; flex-direction: column; gap: 3px"><span>Couldn't start this program.</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{c.t2}}">DELETE requires a WHERE clause</span></span></span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 52px; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; color: {{c.t1}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em">SAVE</button>
        <button style="height: 52px; border-radius: 10px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 0.03em">START</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"$preview":{"width":390,"height":710}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', errorMuted: 'rgba(185,28,28,0.10)', success: '#166534', successMuted: 'rgba(22,101,52,0.10)', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', errorMuted: 'rgba(248,113,113,0.15)', success: '#4ade80', successMuted: 'rgba(74,222,128,0.12)', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    const steps = ['1 · PRIORITIES', '2 · EXERCISES', '3 · VOLUME'].map((label, i) => ({ label, bg: i === 0 ? c.accent : 'transparent', fg: i === 0 ? c.onAccent : c.t2 }));
    return { c, steps };
  }
}
</script>
</body>
</html>
