<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan — priorities</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 990px; box-sizing: border-box; background: {{c.base}}; display: flex; flex-direction: column; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div style="padding: 16px 16px 14px; border-bottom: 1px solid {{c.bsub}}; display: flex; align-items: center; gap: 14px">
    <a href="Programs.dc.html" aria-label="Back to Programs" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.raised}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">PUSH PULL LEGS</span>
      <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px; line-height: 1.05; color: {{c.t1}}">PRIORITIES</span>
    </div>
  </div>
  <div style="padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 12px; overflow: hidden">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="12">
      <div style="border-top: 1px solid {{g.divider}}; padding: 0 16px; display: flex; flex-direction: column">
        <button aria-expanded="{{g.expanded}}" style="min-height: 56px; border: 0; background: transparent; padding: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left">
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 16px; line-height: 20px; color: {{c.t1}}">{{g.label}}</span>
            <sc-if value="{{g.hasSummary}}" hint-placeholder-val="{{false}}"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.08em; line-height: 13px; color: {{c.tm}}">{{g.summary}}</span></sc-if>
          </span>
          <span style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; color: {{c.td}}">
            <sc-if value="{{g.hasMark}}" hint-placeholder-val="{{false}}"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.12em; color: {{g.markFg}}">{{g.mark}}</span></sc-if>
            <sc-if value="{{g.isOpen}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg></sc-if>
            <sc-if value="{{g.isClosed}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></sc-if>
          </span>
        </button>
        <sc-if value="{{g.isOpen}}" hint-placeholder-val="{{false}}">
          <div style="margin: 0 0 12px 2px; padding-left: 14px; border-left: 2px solid {{c.bsub}}; display: flex; flex-direction: column">
            <sc-for list="{{g.subs}}" as="s" hint-placeholder-count="3">
              <div style="height: 36px; display: flex; justify-content: space-between; align-items: center; gap: 8px">
                <span style="font-family: 'Archivo', sans-serif; font-size: 14px; color: {{c.t2}}">{{s.label}}</span>
                <sc-if value="{{s.hasMark}}" hint-placeholder-val="{{false}}"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.12em; color: {{s.markFg}}">{{s.mark}}</span></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
    </div>
  </div>
  <div style="margin-top: auto"></div>
  <nav style="height: 64px; flex: 0 0 auto; border-top: 1px solid {{c.bsub}}; background: {{c.surface}}; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: center">
    <sc-for list="{{nav}}" as="t" hint-placeholder-count="6">
      <a href="#" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: {{t.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; letter-spacing: 0.1em">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"enum","options":["BLUE","CYAN","ORANGE","AMBER","LIME","MINT","INDIGO","VIOLET","PINK"],"default":"BLUE"},"$preview":{"width":390,"height":990}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { base: '#f9f9f8', surface: '#ffffff', raised: '#f2f2f0', overlay: '#e8e8e6', bsub: '#e8e8e6', border: '#d8d8d5', bstrong: '#8a8a85', t1: '#0d0d0c', t2: '#4a4a47', tm: '#62625e', td: '#9a9a96', error: '#b91c1c', success: '#166534', scrim: 'rgba(13,13,12,0.45)' },
      dark: { base: '#0c0c0e', surface: '#18181c', raised: '#212126', overlay: '#2b2b31', bsub: '#2a2a30', border: '#3b3b43', bstrong: '#70707a', t1: '#f4f3ef', t2: '#bcbcc2', tm: '#9a9aa2', td: '#6e6e77', error: '#f87171', success: '#4ade80', scrim: 'rgba(0,0,0,0.70)' }
    };
    const SW = { ORANGE: ['#d06c08', '#f28e42', '#a55506', '#f28e42'], AMBER: ['#b38007', '#dc9e12', '#8b640f', '#dc9e12'], LIME: ['#759a11', '#95bb46', '#587502', '#95bb46'], MINT: ['#13a377', '#1fc893', '#0d7a58', '#1fc893'], CYAN: ['#1a9bae', '#17c0d6', '#147684', '#17c0d6'], BLUE: ['#378bee', '#6eadfe', '#096acb', '#6eadfe'], INDIGO: ['#797aee', '#9ba0fe', '#5f5dce', '#9ba0fe'], VIOLET: ['#a36bdc', '#c190f6', '#884fbe', '#c190f6'], PINK: ['#cf59a2', '#ec81c0', '#b03c86', '#ec81c0'] };
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const S = SW[this.props.accent] || SW.BLUE;
    const D = theme === 'dark';
    const c = Object.assign({}, P[theme], { accent: D ? S[1] : S[0], onAccent: '#0d0d0c', accentText: D ? S[3] : S[2], accentMuted: (D ? S[1] : S[0]) + '26' });
    c.errorMuted = D ? 'rgba(248,113,113,0.15)' : 'rgba(185,28,28,0.10)';
    const ICONS = {
      TODAY: 'M6.5 6.5l11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7',
      PLAN: 'M3 4h7v7H3zM3 14h7v7H3zM14 4h7M14 9h7M14 15h7M14 20h7',
      PROGRESS: 'M22 7l-8.5 8.5-5-5L2 17M16 7h6v6',
      HISTORY: 'M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20zM12 6v6l4 2',
      LIBRARY: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z',
      SETTINGS: 'M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1'
    };
    const nav = Object.keys(ICONS).map((k) => ({ label: k, d: ICONS[k], current: k === 'PLAN' ? 'page' : 'false', fg: k === 'PLAN' ? c.accentText : c.tm }));

    // View-only: this meso's marks. A group shows its own mark; open it to see its subgroups' own marks.
    const L = { focus: 'FOCUS', dont_care: "DON'T CARE" };
    const T = [
      ['CHEST', 'focus', true, [['UPPER CHEST'], ['MID CHEST'], ['LOWER CHEST', 'dont_care']]],
      ['BACK', 'focus', false, [['LATS'], ['MID BACK'], ['LOWER BACK'], ['TRAPS']]],
      ['SHOULDERS', null, false, [['FRONT DELT'], ['SIDE DELT'], ['REAR DELT']]],
      ['BICEPS', null, false, [['BICEPS'], ['BRACHIALIS']]],
      ['TRICEPS', null, false, [['TRICEPS LONG HEAD'], ['TRICEPS LATERAL HEAD']]],
      ['FOREARMS', 'dont_care', false, [['FOREARMS']]],
      ['QUADS', null, false, [['QUADS']]],
      ['HAMSTRINGS', null, false, [['HAMSTRINGS']]],
      ['GLUTES', null, false, [['GLUTES']]],
      ['CALVES', 'dont_care', false, [['CALVES']]],
      ['CORE', null, false, [['ABS'], ['OBLIQUES']]],
      ['OTHER', null, false, [['ADDUCTORS']]]
    ];
    const tc = (x) => x.toLowerCase().replace(/(^|\s)\S/g, (m) => m.toUpperCase());
    const markFg = (m) => m === 'focus' ? c.accentText : c.tm;
    const groups = T.map(([label, mark, open, subs], i) => {
      const exceptions = subs.filter((s) => s[1] && s[1] !== mark).map((s) => s[0]);
      const summary = mark && exceptions.length ? label + ' WITHOUT ' + exceptions.join(', ') : '';
      return { label: tc(label), divider: i === 0 ? 'transparent' : c.bsub, markFg: markFg(mark), hasMark: !!mark, mark: mark ? L[mark] : '', hasSummary: !!summary, summary,
        isOpen: open, isClosed: !open, expanded: open ? 'true' : 'false',
        subs: subs.map(([l, m]) => ({ label: tc(l), hasMark: !!m, mark: m ? L[m] : '', markFg: markFg(m) })) };
    });
    return { c, nav, groups };
  }
}
</script>
</body>
</html>
