<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Program planner — 2 exercises</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1740px; box-sizing: border-box; background: {{c.base}}; display: flex; flex-direction: column; font-family: 'Archivo', sans-serif; color: {{c.t1}}">
  <div style="padding: 16px 16px 14px; border-bottom: 1px solid {{c.bsub}}; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Programs.dc.html" aria-label="Back to programs" style="flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.t2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
      <button aria-label="Rename program" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 8px; text-align: left; color: {{c.t1}}">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Bulk</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.tm}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
      </button>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <a href="{{s.href}}" role="tab" aria-selected="{{s.sel}}" style="text-decoration: none; display: flex; align-items: center; justify-content: center; background: {{s.bg}}; color: {{s.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.15em">{{s.label}}</a>
      </sc-for>
    </div>
  </div>

  <div style="padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div role="group" aria-label="Schedule type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 44px; margin-bottom: 8px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
      <button aria-pressed="true" style="border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">WEEKDAY</button>
      <a href="ProgramPlannerSequence.dc.html" aria-pressed="false" style="text-decoration: none; display: flex; align-items: center; justify-content: center; background: transparent; color: {{c.t2}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">SEQUENCE</a>
    </div>

    <sc-for list="{{before}}" as="o" hint-placeholder-count="1">
      <div style="height: 64px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 16px">
        <span style="flex: 1; min-width: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 16px; color: {{c.t1}}">{{o.name}}</span>
        <span style="flex: 0 0 auto; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.15em; color: {{c.tm}}">{{o.day}}</span>
        <button aria-expanded="false" aria-label="{{o.label}}" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.tm}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      </div>
    </sc-for>

    <div style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 4px; margin-right: -10px">
        <button aria-label="Rename Pull 1" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; padding: 0; text-align: left; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 18px; color: {{c.t1}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Pull 1</button>
        <a href="ProgramPlannerConfirms.dc.html" aria-label="Delete Pull 1" style="flex: 0 0 auto; width: 44px; height: 44px; color: {{c.tm}}; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg></a>
        <button aria-expanded="true" aria-label="Hide editor for Pull 1" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.tm}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg></button>
      </div>
      <div role="group" aria-label="Weekday" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <button aria-pressed="{{d.on}}" style="height: 44px; border-radius: 8px; border: 1px solid {{d.bd}}; background: {{d.bg}}; color: {{d.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.06em; padding: 0">{{d.label}}</button>
        </sc-for>
      </div>

      <div style="margin: 4px -16px 0; border-top: 1px solid {{c.bsub}}; display: flex; flex-direction: column">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
          <sc-if value="{{it.isGap}}" hint-placeholder-val="{{false}}">
            <div style="position: relative; height: 1px; margin-left: 52px; background: {{c.bsub}}">
              <button aria-pressed="{{it.linked}}" aria-label="{{it.linkLabel}}" style="position: absolute; left: -48px; top: -22px; width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
                <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 6px; border: 1px solid {{it.nBd}}; background: {{it.nBg}}; color: {{it.nFg}}; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h8"></path></svg></span>
              </button>
            </div>
          </sc-if>

          <sc-if value="{{it.isEx}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; align-items: stretch; min-height: 64px; padding-right: 6px">
              <div style="position: relative; flex: 0 0 auto; width: 52px; display: flex; align-items: center; justify-content: center">
                <sc-if value="{{it.railUp}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 25px; top: 0; height: calc(50% - 11px); width: 2px; background: {{c.accent}}"></span></sc-if>
                <sc-if value="{{it.railDown}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 25px; bottom: 0; height: calc(50% - 11px); width: 2px; background: {{c.accent}}"></span></sc-if>
                <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12px; color: {{c.tm}}">{{it.n}}</span>
              </div>
              <button aria-expanded="false" aria-label="{{it.openLabel}}" style="flex: 1; min-width: 0; border: 0; background: transparent; padding: 12px 0; text-align: left; display: flex; align-items: center; gap: 8px">
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
                  <span style="font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 15px; line-height: 1.2; color: {{c.t1}}">{{it.name}}</span>
                  <sc-if value="{{it.hasMarks}}" hint-placeholder-val="{{false}}">
                    <span style="display: flex; gap: 6px; flex-wrap: wrap">
                      <sc-for list="{{it.marks}}" as="m" hint-placeholder-count="1">
                        <span style="height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 4px; background: {{c.raised}}; border: 1px solid {{c.bsub}}; color: {{c.t2}}; display: inline-flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.04em">{{m}}</span>
                      </sc-for>
                    </span>
                  </sc-if>
                </span>
                <span style="flex: 0 0 auto; width: 44px; height: 44px; color: {{c.tm}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
              </button>
            </div>
          </sc-if>

          <sc-if value="{{it.isOpen}}" hint-placeholder-val="{{false}}">
            <div style="background: {{c.raised}}; display: flex; align-items: stretch">
              <div style="position: relative; flex: 0 0 auto; width: 52px">
                <span style="position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; color: {{c.accentText}}">{{it.n}}</span>
                <sc-if value="{{it.railDown}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 25px; top: 41px; bottom: 0; width: 2px; background: {{c.accent}}"></span></sc-if>
              </div>
              <div style="flex: 1; min-width: 0; padding: 0 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
                <div style="display: flex; align-items: center; min-height: 60px; margin-right: -10px">
                  <button aria-expanded="true" aria-label="Close Face Pull" style="flex: 1; min-width: 0; min-height: 52px; border: 0; background: transparent; padding: 0; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 4px">
                    <span style="font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 15px; line-height: 1.2; color: {{c.t1}}">Face Pull</span>
                    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.15em; color: {{c.tm}}">SHOULDERS</span>
                  </button>
                  <button aria-label="Move Face Pull up" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg></button>
                  <button aria-label="Move Face Pull down" disabled style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.td}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                  <a href="ProgramPlannerConfirms.dc.html" aria-label="Remove Face Pull" style="flex: 0 0 auto; width: 44px; height: 44px; color: {{c.tm}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg></a>
                </div>
                <div style="display: grid; grid-template-columns: 92px minmax(0, 1fr); row-gap: 8px; align-items: center">
                  <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.tm}}">UNIT</span>
                  <div role="group" aria-label="Unit" style="display: grid; grid-template-columns: 1.8fr 1fr 1fr; height: 44px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
                    <button aria-pressed="true" style="border: 0; background: {{c.accentMuted}}; color: {{c.accentText}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.04em; padding: 0">INHERIT (KG)</button>
                    <button aria-pressed="false" style="border: 0; border-left: 1px solid {{c.bsub}}; background: transparent; color: {{c.t2}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em; padding: 0">KG</button>
                    <button aria-pressed="false" style="border: 0; border-left: 1px solid {{c.bsub}}; background: transparent; color: {{c.t2}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.1em; padding: 0">LBS</button>
                  </div>
                  <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.tm}}">REST</span>
                  <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.accent}}; background: {{c.accentMuted}}; align-items: center">
                    <button aria-label="Less rest" style="height: 100%; border: 0; background: transparent; color: {{c.t2}}; font-size: 16px">−</button>
                    <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; color: {{c.accentText}}">1min 0s</span>
                    <button aria-label="More rest" style="height: 100%; border: 0; background: transparent; color: {{c.t2}}; font-size: 16px">+</button>
                  </div>
                  <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.tm}}">REST AFTER</span>
                  <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; align-items: center">
                    <button aria-label="Less rest after" disabled style="height: 100%; border: 0; background: transparent; color: {{c.td}}; font-size: 16px">−</button>
                    <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12px; letter-spacing: 0.1em; color: {{c.tm}}">NONE</span>
                    <button aria-label="More rest after" style="height: 100%; border: 0; background: transparent; color: {{c.t2}}; font-size: 16px">+</button>
                  </div>
                  <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.tm}}">TEMPO</span>
                  <a href="ProgramPlannerEditing.dc.html" aria-label="Tempo" style="text-decoration: none; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; display: flex; align-items: center; padding: 0 14px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; color: {{c.td}}">—</a>
                </div>
                <div style="margin-top: 8px; padding-top: 12px; border-top: 1px solid {{c.bsub}}; display: grid; grid-template-columns: 92px minmax(0, 1fr); row-gap: 8px; align-items: center">
                  <span style="grid-column: 1 / span 2; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.accentText}}">SUPERSET REST</span>
                  <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.tm}}">WITHIN ROUND</span>
                  <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; align-items: center">
                    <button aria-label="Less rest within round" disabled style="height: 100%; border: 0; background: transparent; color: {{c.td}}; font-size: 16px">−</button>
                    <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.06em; color: {{c.tm}}">NO TIMER</span>
                    <button aria-label="More rest within round" style="height: 100%; border: 0; background: transparent; color: {{c.t2}}; font-size: 16px">+</button>
                  </div>
                  <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.12em; color: {{c.tm}}">AFTER ROUND</span>
                  <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.surface}}; align-items: center">
                    <button aria-label="Less rest after round" disabled style="height: 100%; border: 0; background: transparent; color: {{c.td}}; font-size: 16px">−</button>
                    <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.06em; color: {{c.tm}}">PER EXERCISE</span>
                    <button aria-label="More rest after round" style="height: 100%; border: 0; background: transparent; color: {{c.t2}}; font-size: 16px">+</button>
                  </div>
                </div>
              </div>
            </div>
          </sc-if>
        </sc-for>
        <div style="height: 1px; background: {{c.bsub}}"></div>
      </div>

      <a href="ProgramPlannerPicker.dc.html" style="text-decoration: none; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px dashed {{c.bstrong}}; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">+ ADD EXERCISE</a>

      <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; color: {{c.tm}}">WARMUP ROUTINE</span>
        <div style="margin-right: -10px; display: flex; flex-direction: column">
          <sc-for list="{{warm}}" as="wi" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 4px">
              <a href="ProgramPlannerEditing.dc.html" aria-label="{{wi.editLabel}}" style="flex: 1; min-width: 0; height: 44px; text-decoration: none; display: flex; align-items: center; font-family: 'Archivo', sans-serif; font-size: 15px; color: {{c.t1}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{wi.body}}</a>
              <button aria-label="{{wi.upLabel}}" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{wi.upFg}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg></button>
              <button aria-label="{{wi.downLabel}}" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{wi.downFg}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
              <a href="ProgramPlannerConfirms.dc.html" aria-label="{{wi.removeLabel}}" style="flex: 0 0 auto; width: 44px; height: 44px; color: {{c.tm}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg></a>
            </div>
          </sc-for>
        </div>
        <a href="ProgramPlannerEditing.dc.html" style="margin-top: 4px; text-decoration: none; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px dashed {{c.bstrong}}; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">+ ADD ITEM</a>
      </div>
    </div>

    <sc-for list="{{after}}" as="o" hint-placeholder-count="3">
      <div style="height: 64px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 16px">
        <span style="flex: 1; min-width: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 16px; color: {{c.t1}}">{{o.name}}</span>
        <span style="flex: 0 0 auto; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.15em; color: {{c.tm}}">{{o.day}}</span>
        <button aria-expanded="false" aria-label="{{o.label}}" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.tm}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      </div>
    </sc-for>
    <a href="ProgramPlannerSheets.dc.html" style="text-decoration: none; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px dashed {{c.bstrong}}; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.2em">+ ADD WORKOUT</a>
  </div>

  <div style="margin-top: auto; padding: 12px 16px; border-top: 1px solid {{c.bsub}}; background: {{c.base}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <a href="Programs.dc.html" style="text-decoration: none; height: 52px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.bstrong}}; background: {{c.surface}}; color: {{c.t1}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.2em">SAVE</a>
